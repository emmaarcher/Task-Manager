<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="task">
        <header class="app-header">
            <p class="eyebrow">Daily focus</p>
            <h1>Task Manager</h1>
            <p class="subtitle">Keep the important work moving.</p>
        </header>
        <section class="task-section" aria-labelledby="active-heading">
            <div class="section-heading">
                <h2 id="active-heading">Active tasks</h2>
                <span class="task-count" aria-live="polite">0</span>
            </div>
            <ul class="listTasks"></ul>
        </section>
        <section class="task-section completed-section" aria-labelledby="completed-heading">
            <div class="section-heading">
                <h2 id="completed-heading">Completed</h2>
                <span class="completed-count" aria-live="polite">0</span>
            </div>
            <ul class="completedTasks"></ul>
        </section>
        <form class="getTasks">
            <input type="text" placeholder="What needs doing?" aria-label="New task" required>
            <button type="submit">Add task</button>
        </form>
    </main>
    <script src="main.js" defer></script>
</body>
</html>
